# Deploys a vX.Y.Z tag. The tag's commit must be on main, go build must stamp strux with the tag
# as its version, and the commit must pass every check in ci.yml again. GoReleaser then builds the
# release and saves it as a draft, with build provenance for every archive. The drafted archives
# are unpacked and run on their platforms, and the draft is published only if its assets are
# exactly the ones checked. This workflow signs the provenance, so it stays small and changes only
# when the way strux is released changes.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag's commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Go stamps a tag as the module's version only if the tag suits the module path: from v2 on,
      # the path must end in the major version, as in github.com/altakleos/strux/v2.
      - name: Require go build to stamp the tag as strux's version
        run: |
          go build -o "$RUNNER_TEMP/strux" ./cmd/strux
          version=$("$RUNNER_TEMP/strux" version --json | jq -r .version)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::strux built at $GITHUB_REF_NAME reports version $version"
            exit 1
          fi

  ci:
    needs: tag
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance
      attestations: write # store the provenance
    outputs:
      runners: ${{ steps.runners.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release is built from nothing but its commit
      - name: Build the release and save it as a draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go tool -modfile=tools/goreleaser/go.mod goreleaser release --clean
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - id: runners
        name: Choose the runner for each archive
        run: echo "matrix=$(go run ./internal/cmd/check-release -dir dist -matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  check-draft:
    needs: draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.draft.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - run: go run ./internal/cmd/check-release -dir release -platform "$PLATFORM" -commit "$GITHUB_SHA" -tag "$GITHUB_REF_NAME"
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}

  publish:
    needs: check-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the draft
      attestations: read # verify the provenance
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Verify every archive's provenance
        run: |
          for archive in release/*.tar.gz release/*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Require the draft's assets to be the ones checked
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            | sort > drafted.txt
          { cat release/checksums.txt; sha256sum release/checksums.txt | sed 's|release/||'; } | sort > checked.txt
          diff checked.txt drafted.txt
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
