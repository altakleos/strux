# The checks every change must pass. On a pull request and on main they include building the
# release as a tag would, with a snapshot version, and running each platform's archive on that
# platform, so each change that passes is deployable; the rule on main requires the deployable job.
# release.yml runs this workflow on a tag's commit before it deploys.
#
# Most check jobs run the make target of the same name, so `make check` runs them locally. When
# release.yml runs this workflow no job restores a cache: a run that deploys builds from nothing
# but its commit.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

# A pull request's new commits replace its older run. Every other run completes, in a group of its
# own, since a group keeps only its newest waiting run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      - run: make tidy

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: |
            go.sum
            tools/golangci-lint/go.sum
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: go.sum
      - if: runner.os != 'Windows'
        run: make test
      # Windows runners have no make; this is the command make test runs.
      - if: runner.os == 'Windows'
        run: go test -race -shuffle=on ./...

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: |
            go.sum
            tools/govulncheck/go.sum
      - run: make vuln

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: tools/actionlint/go.sum
      - run: make workflows
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Builds the release as a tag would, with a snapshot version, without publishing it.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      runners: ${{ steps.runners.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the latest tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: |
            go.sum
            tools/goreleaser/go.sum
      - run: make release-check
      - id: runners
        name: Choose the runner for each archive
        run: echo "matrix=$(go run ./internal/cmd/check-release -dir dist -matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot
          path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # The same commit gives the same bytes on another kind of machine.
  reproducible:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: |
            go.sum
            tools/goreleaser/go.sum
      - run: make release-check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot
          path: snapshot
      - name: Compare with the Linux build
        run: diff snapshot/checksums.txt dist/checksums.txt

  # Each archive unpacks and runs on its platform, and reports that platform and this commit.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # check-release needs only the standard library
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot
          path: snapshot
      - run: go run ./internal/cmd/check-release -dir snapshot -platform "$PLATFORM" -commit "$GITHUB_SHA"
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}

  # Passes only when every check passed: the change is deployable.
  deployable:
    if: always()
    needs: [tidy, lint, test, vuln, workflows, build, reproducible, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a check ended with: $result"
              exit 1
            fi
          done
