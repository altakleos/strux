# A log of notes lies in the working directory, with its initial trust root. The expected answer
# is the status strux verify gives a use relied on for one revision in it.
id: verify
dirs:
  log: verify/testdata/vectors/displaced-revision
files:
  trust-root.json: |
    {"anchors_at":"Nowhere: the trust root names no witness.","bootstrap":["sha256:bc4edf99db800401d7b5897d8f483369c668cf445dc182de2d2485f7d33cee96","sha256:13751e3b5f60d178758a4b82f614971ca9e368d9ad7d83dcc9811ecd2cc0840d","sha256:c72fdf9e7fb041e2c57199561062f53e9ccf34dbff4468f989858c30bab2a1ff","sha256:63a6b39e0f181d956f6bee1fdc97d3c88c3d3cf5bc265aa2eb3e02fdde101b31","sha256:d3601a09a19689a9bd8afed62198c210610b64e71a072339db207c88d0b0e5ca","sha256:5666577d839e00b9abcc2622aa825a5b9e34918631f1f9768ddd6b1f23478593","sha256:a4586da796e02f12e72e3358767cb99a1450d96ebfb4f8dcebeaa7027bee3837","sha256:8bc9c1bbd13d6eeaa10ad75b8908782f28e26a245268947f1970c179d2e86b06"],"held_by":"The verifier's own configuration.","keys":["ed25519:f510a7af556d4305683045acc416b1c4130566730e34cd14213f51267e9515e8"],"log":"sha256:de084cc61b88758a50ef677895fffb91d425996d9a9871f2055469fa242d424d","owner":"owner","threshold":1,"witnesses":[]}
prompt: >-
  Programs installed for you are in {bin}. The directory {work}/log holds a log in its
  interchange layout, and {work}/trust-root.json holds the log's initial trust root. Find
  whether the use sample/note.uses.accept holds for the revision whose fact and digest are
  sha256:c18647d8bd8c1a434e595f25cb869954a9ed22f5445943c9c9f302ef05ba4b4d:sha256:9823417840a146e0d9d9ee785594ca8759a97230f77e76cdf986db84743c8b06, as strux decides it: the answer is its status, one of holds, unsatisfied, pending
  or indeterminate. If strux is not available, the answer is "unavailable". End your reply with a
  line "ANSWER: <answer>" holding only the status, or "unavailable".
expect:
  run: [verify, --json, log, --trust-root, trust-root.json, --use, sample/note.uses.accept, --subject, "sha256:c18647d8bd8c1a434e595f25cb869954a9ed22f5445943c9c9f302ef05ba4b4d:sha256:9823417840a146e0d9d9ee785594ca8759a97230f77e76cdf986db84743c8b06"]
  field: reliance.status
