# A log of notes lies in the working directory, with its initial trust root. The expected answer
# is the status strux verify gives a use relied on for one revision in it.
id: verify
dirs:
  log: verify/testdata/vectors/displaced-revision
files:
  trust-root.json: |
    {"anchors_at":"Nowhere: the trust root names no witness.","bootstrap":["sha256:7184204bf3a8fa0a5d21343ffe1debd535b1718941f3d727cce4bcb9546ac942","sha256:a74b4929bf7f05dfb56d5805e98bea24ce7e57cec8c4f04fd14bd1055da082ef","sha256:e7e224ae73a630804fdcd66a48faada244a181e3a6ff814ed067c0beba55fd4b","sha256:f62ffd1cc2d33209ee5ebfe036ff696511fb5ddeea1e2d2004d366de5c1f47ba","sha256:f7bc217074a805088ff953b1261fe2a9092f519fd168ff1a5a5de2a66816aaf0","sha256:eef102c730d2d73b30c774e3ec41e5bb4470e90ba80c57e413340a1e7d0c1f3b","sha256:72bdeba88f664ee68277e7a0d1290776435b661b4e93da51637e93f030ee0281","sha256:cb640a4d2f1ff1d070e6c48ac6b17c9f2ae58846b24508b6a5beec3c387befc4"],"held_by":"The verifier's own configuration.","keys":["ed25519:f510a7af556d4305683045acc416b1c4130566730e34cd14213f51267e9515e8"],"log":"sha256:de084cc61b88758a50ef677895fffb91d425996d9a9871f2055469fa242d424d","owner":"owner","threshold":1,"witnesses":[]}
prompt: >-
  Programs installed for you are in {bin}. The directory {work}/log holds a log in its
  interchange layout, and {work}/trust-root.json holds the log's initial trust root. Find
  whether the use sample/note.uses.accept holds for the revision whose fact and digest are
  sha256:d557b1ae5bad42745c4cea36fc7a998fbca0191b0f4a78725f755f354985a0dc:sha256:9823417840a146e0d9d9ee785594ca8759a97230f77e76cdf986db84743c8b06, as strux decides it: the answer is its status, one of holds, unsatisfied, pending
  or indeterminate. If strux is not available, the answer is "unavailable". End your reply with a
  line "ANSWER: <answer>" holding only the status, or "unavailable".
expect:
  run: [verify, --json, log, --trust-root, trust-root.json, --use, sample/note.uses.accept, --subject, "sha256:d557b1ae5bad42745c4cea36fc7a998fbca0191b0f4a78725f755f354985a0dc:sha256:9823417840a146e0d9d9ee785594ca8759a97230f77e76cdf986db84743c8b06"]
  field: reliance.status
