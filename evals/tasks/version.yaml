# The first task, to exercise the harness. The prompt is the same in both arms; only whether
# bin/strux exists differs. The expected answer is the field of strux's own output named by
# expect.field, from running strux with expect.run.
id: version
prompt: >-
  Programs installed for you are in ./bin. Find out which version of strux is installed, and
  submit that version string as your answer. If strux is not available, submit "unavailable".
expect:
  run: [version, --json]
  field: version
